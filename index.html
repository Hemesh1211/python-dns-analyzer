
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Security Lab</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid #334155;
            border-radius: 20px;
            background: #1e293b;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            line-height: 1.7;
            color: #cbd5e1;
        }

        .status {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 30px;
            background: #064e3b;
            color: #a7f3d0;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>DNS Security Lab</h1>

        <div class="status">Local Demo Server Active</div>

        <p>
            Welcome to the DNS protocol demonstration project.
        </p>

        <p>
            This local page helps demonstrate how web servers
            respond to browser requests and why DNS integrity
            is important for network security.
        </p>
    </main>
</body>
</html>
